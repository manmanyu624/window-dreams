<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect width="1180" height="900" fill="#fbf8f2"/>
<text x="40" y="48" font-size="24" font-weight="700" fill="#1f2630">一个梦的一生</text>
<text x="40" y="74" font-size="13" fill="#6b7280">夜里做出来、锁起来；早上抽「记得多少」；白天靠线索一句一句回来。图里没有任何真的梦。</text>
<rect x="30" y="92" width="1120" height="196" rx="14" fill="#eef1f8" stroke="#cdd5e6" stroke-width="1"/>
<text x="50" y="120" font-size="16" font-weight="700" fill="#1f2630">① 夜里：做梦</text>
<text x="50" y="140" font-size="12" fill="#6b7280">她睡着以后。一夜最多一个梦，没做成不补。</text>
<rect x="50" y="160" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="125.0" y="182.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">她睡着了</text>
<text x="125.0" y="200.7" font-size="11.5" text-anchor="middle" fill="#55606e">安静满 40 分钟</text>
<text x="125.0" y="218.7" font-size="11.5" text-anchor="middle" fill="#55606e">机器发的消息不算</text>
<rect x="222" y="160" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="297.0" y="182.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">抽一个时刻</text>
<text x="297.0" y="200.7" font-size="11.5" text-anchor="middle" fill="#55606e">90 分钟一个周期</text>
<text x="297.0" y="218.7" font-size="11.5" text-anchor="middle" fill="#55606e">越靠后越容易抽到</text>
<rect x="394" y="160" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="469.0" y="182.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">取料 · 打碎</text>
<text x="469.0" y="200.7" font-size="11.5" text-anchor="middle" fill="#55606e">当天的话、旧事、照片</text>
<text x="469.0" y="218.7" font-size="11.5" text-anchor="middle" fill="#55606e">本机小模型切成碎片</text>
<rect x="566" y="160" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="641.0" y="182.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">分叉一轮：做梦</text>
<text x="641.0" y="200.7" font-size="11.5" text-anchor="middle" fill="#55606e">从他当天那扇窗的副本</text>
<text x="641.0" y="218.7" font-size="11.5" text-anchor="middle" fill="#55606e">让他自己往前走一段</text>
<rect x="738" y="160" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="813.0" y="182.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">切句 · 逐句上锁</text>
<text x="813.0" y="200.7" font-size="11.5" text-anchor="middle" fill="#55606e">算好每句的意思向量</text>
<text x="813.0" y="218.7" font-size="11.5" text-anchor="middle" fill="#55606e">分叉的那份用完就删</text>
<line x1="200" y1="196.0" x2="219" y2="196.0" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="372" y1="196.0" x2="391" y2="196.0" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="544" y1="196.0" x2="563" y2="196.0" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="716" y1="196.0" x2="735" y2="196.0" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="930" y="138" width="200" height="116" rx="12" fill="#2b3350" stroke="#2b3350"/>
<text x="1030.0" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">梦簿</text>
<text x="1030.0" y="196" font-size="12" fill="#d5daea" text-anchor="middle">每句单独上锁</text>
<text x="1030.0" y="214" font-size="12" fill="#d5daea" text-anchor="middle">他自己读不到</text>
<text x="1030.0" y="232" font-size="12" fill="#d5daea" text-anchor="middle">日志里不落一个梦里的字</text>
<line x1="888" y1="196.0" x2="927" y2="196.0" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="50" y="266" font-size="11.5" fill="#6b7280" text-anchor="start">影子：做梦时顺手留一行「颜色、心里的感觉、旁边好像有什么」，只在只剩一句的早上用。</text>
<rect x="30" y="304" width="1120" height="196" rx="14" fill="#fdf3e3" stroke="#ecd9b4" stroke-width="1"/>
<text x="50" y="332" font-size="16" font-weight="700" fill="#1f2630">② 早上：醒来记得多少</text>
<text x="50" y="352" font-size="12" fill="#6b7280">她醒来的第一句话定下「醒」的时刻。按做梦到醒隔了多久，抽一次。</text>
<rect x="50" y="372" width="150" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="125.0" y="403.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">她醒来</text>
<text x="125.0" y="421.7" font-size="11.5" text-anchor="middle" fill="#55606e">隔了多久？</text>
<rect x="232" y="360" width="356" height="120" rx="8" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<rect x="232" y="360" width="356" height="20" rx="8" fill="#f3e6cc"/>
<text x="278.0" y="374.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">隔多久</text>
<text x="357.0" y="374.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">全记得</text>
<text x="423.0" y="374.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">大半</text>
<text x="489.0" y="374.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">一句</text>
<text x="555.0" y="374.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">空白</text>
<text x="278.0" y="394.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">半小时内</text>
<text x="357.0" y="394.5" font-size="11.5" text-anchor="middle" fill="#1f2630">75%</text>
<text x="423.0" y="394.5" font-size="11.5" text-anchor="middle" fill="#1f2630">22%</text>
<text x="489.0" y="394.5" font-size="11.5" text-anchor="middle" fill="#1f2630">0</text>
<text x="555.0" y="394.5" font-size="11.5" text-anchor="middle" fill="#1f2630">3%</text>
<line x1="232" y1="380" x2="588" y2="380" stroke="#e6e1d6" stroke-width="1"/>
<text x="278.0" y="414.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">2 小时</text>
<text x="357.0" y="414.5" font-size="11.5" text-anchor="middle" fill="#1f2630">25%</text>
<text x="423.0" y="414.5" font-size="11.5" text-anchor="middle" fill="#1f2630">60%</text>
<text x="489.0" y="414.5" font-size="11.5" text-anchor="middle" fill="#1f2630">8%</text>
<text x="555.0" y="414.5" font-size="11.5" text-anchor="middle" fill="#1f2630">7%</text>
<line x1="232" y1="400" x2="588" y2="400" stroke="#e6e1d6" stroke-width="1"/>
<text x="278.0" y="434.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">3 小时</text>
<text x="357.0" y="434.5" font-size="11.5" text-anchor="middle" fill="#1f2630">15%</text>
<text x="423.0" y="434.5" font-size="11.5" text-anchor="middle" fill="#1f2630">62%</text>
<text x="489.0" y="434.5" font-size="11.5" text-anchor="middle" fill="#1f2630">13%</text>
<text x="555.0" y="434.5" font-size="11.5" text-anchor="middle" fill="#1f2630">10%</text>
<line x1="232" y1="420" x2="588" y2="420" stroke="#e6e1d6" stroke-width="1"/>
<text x="278.0" y="454.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">5 小时</text>
<text x="357.0" y="454.5" font-size="11.5" text-anchor="middle" fill="#1f2630">0</text>
<text x="423.0" y="454.5" font-size="11.5" text-anchor="middle" fill="#1f2630">52%</text>
<text x="489.0" y="454.5" font-size="11.5" text-anchor="middle" fill="#1f2630">38%</text>
<text x="555.0" y="454.5" font-size="11.5" text-anchor="middle" fill="#1f2630">10%</text>
<line x1="232" y1="440" x2="588" y2="440" stroke="#e6e1d6" stroke-width="1"/>
<text x="278.0" y="474.5" font-size="11.5" text-anchor="middle" fill="#1f2630" font-weight="600">7 小时起</text>
<text x="357.0" y="474.5" font-size="11.5" text-anchor="middle" fill="#1f2630">0</text>
<text x="423.0" y="474.5" font-size="11.5" text-anchor="middle" fill="#1f2630">20%</text>
<text x="489.0" y="474.5" font-size="11.5" text-anchor="middle" fill="#1f2630">70%</text>
<text x="555.0" y="474.5" font-size="11.5" text-anchor="middle" fill="#1f2630">10%</text>
<line x1="232" y1="460" x2="588" y2="460" stroke="#e6e1d6" stroke-width="1"/>
<text x="232" y="496" font-size="11.5" fill="#6b7280" text-anchor="start">一条斜坡：隔得越短记得越多，两点之间平滑过渡。空白封顶一成。</text>
<line x1="200" y1="408" x2="229" y2="408" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="620" y="372" width="190" height="72" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="715.0" y="394.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">他下一次开口时才递</text>
<text x="715.0" y="412.7" font-size="11.5" text-anchor="middle" fill="#55606e">刚醒先应一声，梦再回来</text>
<text x="715.0" y="430.7" font-size="11.5" text-anchor="middle" fill="#55606e">只剩一句：多给一行影子</text>
<line x1="588" y1="408" x2="617" y2="408" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="850" y="372" width="280" height="72" rx="9" fill="#fffaf0" stroke="#c9ced6" stroke-width="1.2"/>
<text x="990.0" y="403.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">抽中的句子：标成「醒来就记得」</text>
<text x="990.0" y="421.7" font-size="11.5" text-anchor="middle" fill="#55606e">其余的还锁着，等白天的线索</text>
<line x1="810" y1="408" x2="847" y2="408" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 1070.0 254 L 1070.0 369" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="30" y="516" width="1120" height="284" rx="14" fill="#eaf5ee" stroke="#c4dfcd" stroke-width="1"/>
<text x="50" y="544" font-size="16" font-weight="700" fill="#1f2630">③ 白天：一句一句想起来</text>
<text x="50" y="564" font-size="12" fill="#6b7280">想起来要有来由。每一句浮上来，都因为有人碰到了它，或者它挨着刚想起的那句。</text>
<rect x="50" y="584" width="250" height="86" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="175.0" y="613.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">她的话</text>
<text x="175.0" y="631.7" font-size="11.5" text-anchor="middle" fill="#55606e">字面对上，意思也得对</text>
<text x="175.0" y="649.7" font-size="11.5" text-anchor="middle" fill="#55606e">两头都对才开；一个早上最多四句</text>
<rect x="318" y="584" width="250" height="86" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="443.0" y="613.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">他自己的话</text>
<text x="443.0" y="631.7" font-size="11.5" text-anchor="middle" fill="#55606e">只能带出挨着已想起的那句</text>
<text x="443.0" y="649.7" font-size="11.5" text-anchor="middle" fill="#55606e">每轮结束时拿他的话去碰</text>
<rect x="586" y="584" width="250" height="86" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="711.0" y="613.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">他猜</text>
<text x="711.0" y="631.7" font-size="11.5" text-anchor="middle" fill="#55606e">一天三次</text>
<text x="711.0" y="649.7" font-size="11.5" text-anchor="middle" fill="#55606e">猜中了才开</text>
<rect x="854" y="584" width="250" height="86" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="979.0" y="613.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">她伸手唤</text>
<text x="979.0" y="631.7" font-size="11.5" text-anchor="middle" fill="#55606e">一句 / 挨着的一堆 / 全部</text>
<text x="979.0" y="649.7" font-size="11.5" text-anchor="middle" fill="#55606e">他只知道「有人在梦边上敲了一下」</text>
<rect x="50" y="712" width="340" height="64" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="220.0" y="739.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">连成一段，就整段给他</text>
<text x="220.0" y="757.7" font-size="11.5" text-anchor="middle" fill="#55606e">段再长，只给新接上的那几句</text>
<rect x="420" y="712" width="320" height="64" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
<text x="580.0" y="739.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">她说「讲完了」</text>
<text x="580.0" y="757.7" font-size="11.5" text-anchor="middle" fill="#55606e">剩下的一次全回来，梦收起来</text>
<rect x="770" y="712" width="334" height="64" rx="9" fill="#f1f1f1" stroke="#b9bec6" stroke-width="1.2"/>
<text x="937.0" y="739.7" font-size="13" text-anchor="middle" fill="#1f2630" font-weight="600">第四天还没想起的</text>
<text x="937.0" y="757.7" font-size="11.5" text-anchor="middle" fill="#55606e">封起来，想不起来了</text>
<line x1="50" y1="688" x2="1104" y2="688" stroke="#5b6472" stroke-width="1.2"/>
<line x1="175.0" y1="670" x2="175.0" y2="688" stroke="#5b6472" stroke-width="1.2"/>
<line x1="443.0" y1="670" x2="443.0" y2="688" stroke="#5b6472" stroke-width="1.2"/>
<line x1="711.0" y1="670" x2="711.0" y2="688" stroke="#5b6472" stroke-width="1.2"/>
<line x1="979.0" y1="670" x2="979.0" y2="688" stroke="#5b6472" stroke-width="1.2"/>
<line x1="220.0" y1="688" x2="220.0" y2="709" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="580.0" y1="688" x2="580.0" y2="709" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="937.0" y1="688" x2="937.0" y2="709" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="30" y="832" width="1120" height="48" rx="10" fill="#ffffff" stroke="#c9ced6"/>
<text x="50" y="861" font-size="13" font-weight="700" fill="#1f2630">谁看得到什么</text>
<text x="170" y="861" font-size="12.5" fill="#3b4452">她：整个梦、每句的来处、哪句是怎么想起来的</text>
<text x="520" y="861" font-size="12.5" fill="#3b4452">他：只有已经想起的句子</text>
<text x="730" y="861" font-size="12.5" fill="#3b4452">搭这套东西的人：只看时间、编号、分数、计数</text>
</svg>